name: PR Preview

on:
  pull_request:
    branches: [main]

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      # Deploy only runs once a copy of this template has its own Firebase project.
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Verify build output
        run: |
          for page in index.html about/index.html services/index.html contact/index.html blog/index.html privacy/index.html terms/index.html nl/index.html 404.html rss.xml; do
            test -s "dist/$page" || { echo "Missing or empty: dist/$page"; exit 1; }
          done
          echo "All critical pages present."

      - name: Skip deploy (no Firebase secret)
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "FIREBASE_SERVICE_ACCOUNT is not set, so the build was checked but not deployed."

      - if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: your-firebase-project-id
          # omitting channelId creates a preview channel automatically
